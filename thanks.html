<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks — Now What?</title>
  <meta name="theme-color" content="#050b18">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
      color:#f4f7ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 18% 18%,rgba(76,141,255,.18),transparent 26rem),
        radial-gradient(circle at 82% 72%,rgba(169,98,255,.14),transparent 26rem),
        #020713;
    }
    .card{
      width:min(100%,680px);padding:42px;border:1px solid rgba(132,184,255,.19);
      border-radius:28px;background:rgba(5,12,27,.92);text-align:center;
      box-shadow:0 30px 90px rgba(0,0,0,.28)
    }
    img{width:110px;height:110px;border-radius:24px;box-shadow:0 12px 38px rgba(0,0,0,.35)}
    h1{margin:24px 0 10px;font-size:clamp(2.2rem,7vw,4rem);letter-spacing:-.05em}
    p{margin:0 auto;color:#aab5c8;max-width:520px;font-size:1.06rem;line-height:1.6}
    a{
      display:inline-flex;margin-top:28px;min-height:50px;padding:0 21px;align-items:center;
      justify-content:center;border-radius:999px;text-decoration:none;font-weight:800;color:#06101f;
      background:linear-gradient(100deg,#eff9ff,#9fefff 35%,#d7bdff 72%,#ffd685)
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="nowwhat-icon.webp" alt="Now What? icon">
    <h1>You're in the queue.</h1>
    <p>
      Thanks for volunteering to beta test Now What? Your application was received.
      If you're a fit for this round, you'll hear from Now What? with next steps.
    </p>
    <a href="/">Back to Now What?</a>
  </main>
</body>
</html>
